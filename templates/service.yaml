apiVersion: v1
kind: Service
metadata:
  name: inv-catalog-service
  labels:
    app: inventory-catalog
spec:
  selector:
    app: inventory-catalog
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    nodePort: {{ .Values.service.nodePort }}
 # type: NodePort
  type: {{ .Values.service.type }}
