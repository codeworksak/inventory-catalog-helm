apiVersion: v1
kind: Service
metadata:
  name: inv-catalog-service
  labels:
    app: inventory-catalog
spec:
  selector:
    app: inventory-catalog
  ports:
  - protocol: TCP
    port: {{ .Values.service.port | int }}
    targetPort: {{ .Values.service.port | int }}
    nodePort: {{ .Values.service.nodePort | int }}
 # type: NodePort
  type: "{{ .Values.service.type }}"
